<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 138" width="100%" height="100%">
  <defs>
    <linearGradient id="b1_shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="50%" stop-color="#070c16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <linearGradient id="b1_laserRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9944"/>
      <stop offset="60%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#b33300"/>
    </linearGradient>

    <linearGradient id="b1_titanium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="b1_arancio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa64d"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#ba3604"/>
    </linearGradient>

    <filter id="b1_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#ff5500" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. COMPACT HEX SHIELD (Maximized internal area, no wasted margins) -->
  <g filter="url(#b1_glow)">
    <path d="M 60,4 L 112,22 L 104,86 L 60,132 L 16,86 L 8,22 Z" 
          fill="url(#b1_shieldBg)" 
          stroke="url(#b1_laserRim)" 
          stroke-width="3" 
          stroke-linejoin="round"/>
    
    <!-- Subtle Inner Hex Pinstripe -->
    <path d="M 60,10 L 106,26 L 98,82 L 60,124 L 22,82 L 14,26 Z" 
          fill="none" 
          stroke="rgba(255,255,255,0.18)" 
          stroke-width="1" 
          stroke-linejoin="round"/>
  </g>

  <!-- 2. FLUID SKELETONIZED MMM (DIRECȚIA B NEGATIVE SPACE MONOGRAM) -->
  <!-- Centered at x=60, y=62, Height=56, Width=82 -->
  <g transform="translate(60, 62)">
    
    <!-- LEFT M: SOLID ARANCIO XANTO (AERO FIN) -->
    <!-- Outer leg, V-cut, inner leg contoured for negative space -->
    <path d="M -39,-28 L -28,-28 L -20,-6 L -12,-28 L -1,-28 L -1,28 L -10,28 L -10,-6 L -16,11 L -24,11 L -30,-6 L -30,28 L -39,28 Z" 
          fill="url(#b1_arancio)" 
          stroke="#ffffff" 
          stroke-width="0.5" 
          stroke-opacity="0.4"/>

    <!-- CENTER INVERTED M: BRUSHED TITANIUM / PLATINUM (SHARP NEGATIVE-SPACE GEM) -->
    <!-- Seamlessly nested in the central channel -->
    <path d="M -13,-24 L -4,-24 L 0,-12 L 4,-24 L 13,-24 L 13,24 L 5,24 L 5,-4 L 0,8 L -5,-4 L -5,24 L -13,24 Z" 
          fill="url(#b1_titanium)" 
          stroke="#000000" 
          stroke-width="1.2" 
          stroke-opacity="0.6"/>

    <!-- RIGHT M: SOLID ARANCIO XANTO (AERO FIN) -->
    <path d="M 1,-28 L 12,-28 L 20,-6 L 28,-28 L 39,-28 L 39,28 L 30,28 L 30,-6 L 24,11 L 16,11 L 10,-6 L 10,28 L 1,28 Z" 
          fill="url(#b1_arancio)" 
          stroke="#ffffff" 
          stroke-width="0.5" 
          stroke-opacity="0.4"/>

  </g>

  <!-- 3. BASE STINGER ACCENT (REFINED RACING CHOP) -->
  <polygon points="60,102 65,116 55,116" fill="url(#b1_laserRim)"/>
</svg>