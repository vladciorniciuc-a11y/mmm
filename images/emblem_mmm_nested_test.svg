<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient: Deep Obsidian & Carbon -->
    <linearGradient id="n_shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2c"/>
      <stop offset="40%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Outer Rim Gradient: Stealth Titanium with Arancio Xanto edge reflection -->
    <linearGradient id="n_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="20%" stop-color="#94a3b8"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="75%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Layer 1 Gradient: Primary Arancio Xanto Neon -->
    <linearGradient id="n_layer1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0e6"/>
      <stop offset="25%" stop-color="#ff994d"/>
      <stop offset="70%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#b33300"/>
    </linearGradient>

    <!-- Layer 2 Gradient: Brilliant Titanium Platinum -->
    <linearGradient id="n_layer2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f1f5f9"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Layer 3 Gradient: Deep Anodized Amber Gold / Stealth Gunmetal -->
    <linearGradient id="n_layer3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Forged Carbon Monocoque Texture -->
    <pattern id="n_carbon" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#060912"/>
      <polygon points="0,0 14,4 18,16 4,12" fill="#0d1522" opacity="0.85"/>
      <polygon points="14,4 28,0 24,14 18,8" fill="#141f33" opacity="0.6"/>
      <polygon points="4,12 18,16 14,28 0,22" fill="#0a101b" opacity="0.9"/>
      <polygon points="18,16 28,14 28,28 16,24" fill="#18253b" opacity="0.65"/>
      <line x1="0" y1="14" x2="28" y2="14" stroke="#ff6b00" stroke-width="0.3" opacity="0.12"/>
    </pattern>

    <filter id="n_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#ff5500" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- 1. BASE OUTER SHIELD (Hexagonal Supercar Armor Plate) -->
  <g filter="url(#n_glow)">
    <path d="M 200,16 L 360,68 L 334,284 L 200,442 L 66,284 L 40,68 Z" 
          fill="url(#n_shieldBg)" 
          stroke="url(#n_rim)" 
          stroke-width="5" 
          stroke-linejoin="miter" 
          stroke-miterlimit="4"/>

    <!-- Forged Carbon Monocoque Inlay -->
    <path d="M 200,28 L 346,76 L 322,276 L 200,424 L 78,276 L 54,76 Z" 
          fill="url(#n_carbon)"/>

    <!-- Laser Pinstripe Frame -->
    <path d="M 200,36 L 336,82 L 314,270 L 200,412 L 86,270 L 64,82 Z" 
          fill="none" 
          stroke="url(#n_layer1)" 
          stroke-width="1.8" 
          stroke-opacity="0.85" 
          stroke-linejoin="round"/>
  </g>

  <!-- 2. APEX ROOF-SNORKEL / TWIN NACA DUCTS -->
  <g transform="translate(200, 52)">
    <polygon points="0,-6 18,12 -18,12" fill="url(#n_layer1)"/>
    <polygon points="0,-2 11,10 -11,10" fill="#04070e"/>
    <line x1="-34" y1="10" x2="-16" y2="10" stroke="url(#n_rim)" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="10" x2="34" y2="10" stroke="url(#n_rim)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="5.5" r="2" fill="#ffffff"/>
  </g>

  <!-- 3. THE NESTED TRIPLE-M MONOGRAM (ADAPTED DIRECTLY FROM USER IMAGE) -->
  <!-- Centered at (200, 190), Width=220, Height=190 -->
  <g transform="translate(200, 190)">
    
    <!-- ======================================================== -->
    <!-- LAYER 3: INNERMOST M (Deep Amber Gold / Titanium Accent) -->
    <!-- Width: X -52 to +52. Central V drops to Y = +25 -->
    <!-- ======================================================== -->
    <!-- Vertical Legs (Inner Slot 3) -->
    <rect x="-64" y="-80" width="12" height="150" rx="3" fill="url(#n_layer3)"/>
    <rect x="52" y="-80" width="12" height="150" rx="3" fill="url(#n_layer3)"/>
    <!-- Central V-Arm -->
    <path d="
      M -64,-80 L -52,-80 L 0,25 L 52,-80 L 64,-80 L 6,-2 L -6,-2 Z" 
      fill="url(#n_layer3)" opacity="0.95"/>

    <!-- ======================================================== -->
    <!-- LAYER 2: MIDDLE M (Brilliant Titanium Platinum) -->
    <!-- Width: X -80 to +80. Central V drops to Y = +55 -->
    <!-- ======================================================== -->
    <!-- Vertical Legs (Slot 2) -->
    <rect x="-84" y="-80" width="12" height="150" rx="3" fill="url(#n_layer2)"/>
    <rect x="72" y="-80" width="12" height="150" rx="3" fill="url(#n_layer2)"/>
    <!-- Central V-Arm -->
    <path d="
      M -84,-80 L -72,-80 L 0,55 L 72,-80 L 84,-80 L 7,24 L -7,24 Z" 
      fill="url(#n_layer2)"/>

    <!-- ======================================================== -->
    <!-- LAYER 1: OUTER / FRONT M (Arancio Xanto Neon Laser) -->
    <!-- Width: X -104 to +104. Central V drops to Y = +88 (Lowest Stinger!) -->
    <!-- ======================================================== -->
    <!-- Vertical Legs (Outer Slot 1) -->
    <rect x="-104" y="-80" width="12" height="150" rx="3" fill="url(#n_layer1)"/>
    <rect x="92" y="-80" width="12" height="150" rx="3" fill="url(#n_layer1)"/>
    <!-- Central Primary V-Arm (Sharp Stinger Pointing to Shield Tip) -->
    <path d="
      M -104,-80 L -92,-80 L 0,88 L 92,-80 L 104,-80 L 8,50 L -8,50 Z" 
      fill="url(#n_layer1)"/>

    <!-- Metallic bevel cuts on front chevron -->
    <line x1="-98" y1="-80" x2="0" y2="82" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="98" y1="-80" x2="0" y2="82" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6"/>
  </g>

  <!-- 4. LOWER THIRD: TECHNICAL COLLECTOR BADGE ("1 OF 1499") -->
  <g transform="translate(200, 335)" text-anchor="middle">
    <!-- Diffuser blade -->
    <path d="M -52,-6 L -22,-1 L 0,-10 L 22,-1 L 52,-6 L 34,2 L 0,-2 L -34,2 Z" 
          fill="url(#n_layer1)"/>

    <rect x="-84" y="8" width="168" height="26" rx="4" 
          fill="#070c16" 
          stroke="url(#n_rim)" 
          stroke-width="1.2"/>
    
    <text y="25.5" 
          font-family="'Space Grotesk', -apple-system, sans-serif" 
          font-size="11" 
          font-weight="900" 
          letter-spacing="3" 
          fill="#ffffff">1 OF 1499</text>

    <text y="48" 
          font-family="'Space Grotesk', -apple-system, sans-serif" 
          font-size="8.5" 
          font-weight="800" 
          letter-spacing="2" 
          fill="#ff944d">HURAC&#193;N STERRATO &#183; MMM</text>
  </g>

  <!-- 5. BOTTOM RAZOR STINGER -->
  <polygon points="200,398 206,418 194,418" fill="url(#n_layer1)"/>
</svg>