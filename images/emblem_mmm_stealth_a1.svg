<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="100%" height="100%">
  <defs>
    <!-- Deep Matte Obsidian / Stealth Body -->
    <linearGradient id="shieldBaseA1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2c"/>
      <stop offset="35%" stop-color="#080d17"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Stealth Gunmetal Rim with Arancio Xanto Rim Lighting -->
    <linearGradient id="stealthBevelA1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="15%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#b43403"/>
    </linearGradient>

    <!-- Arancio Xanto Laser Gradient -->
    <linearGradient id="arancioLaserA1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2e5"/>
      <stop offset="20%" stop-color="#ff944d"/>
      <stop offset="65%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#ba3402"/>
    </linearGradient>

    <!-- Brushed Titanium Infill for Center Negative M -->
    <linearGradient id="titaniumA1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Forged Carbon Texture -->
    <pattern id="forgedCarbonA1" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#070b13"/>
      <polygon points="0,0 14,4 18,16 4,12" fill="#0e1624" opacity="0.8"/>
      <polygon points="14,4 28,0 24,14 18,8" fill="#152136" opacity="0.6"/>
      <polygon points="4,12 18,16 14,28 0,22" fill="#0b121e" opacity="0.85"/>
      <polygon points="18,16 28,14 28,28 16,24" fill="#1a273e" opacity="0.65"/>
      <line x1="0" y1="14" x2="28" y2="14" stroke="#ff6b00" stroke-width="0.3" opacity="0.15"/>
    </pattern>

    <!-- Ambient Presence Filter -->
    <filter id="stealthGlowA1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ff5500" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- 1. BASE OUTER SHIELD: STEALTH HEXAGON -->
  <g filter="url(#stealthGlowA1)">
    <path d="M 200,16 L 360,68 L 334,284 L 200,442 L 66,284 L 40,68 Z" 
          fill="url(#shieldBaseA1)" 
          stroke="url(#stealthBevelA1)" 
          stroke-width="5" 
          stroke-linejoin="miter" 
          stroke-miterlimit="4"/>

    <!-- Forged Carbon Monocoque Inlay -->
    <path d="M 200,28 L 346,76 L 322,276 L 200,424 L 78,276 L 54,76 Z" 
          fill="url(#forgedCarbonA1)"/>

    <!-- Arancio Laser Pinstripe -->
    <path d="M 200,36 L 336,82 L 314,270 L 200,412 L 86,270 L 64,82 Z" 
          fill="none" 
          stroke="url(#arancioLaserA1)" 
          stroke-width="1.8" 
          stroke-opacity="0.9" 
          stroke-linejoin="round"/>
  </g>

  <!-- 2. TOP APEX: ROOF SNORKEL NACA DUCT -->
  <g transform="translate(200, 52)">
    <polygon points="0,-6 18,12 -18,12" fill="url(#arancioLaserA1)"/>
    <polygon points="0,-2 11,10 -11,10" fill="#04070e"/>
    <line x1="-34" y1="10" x2="-16" y2="10" stroke="url(#stealthBevelA1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="10" x2="34" y2="10" stroke="url(#stealthBevelA1)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="5.5" r="2" fill="#ffffff"/>
  </g>

  <!-- 3. THE MMM MONOGRAM: SEAMLESS INTERLOCKING TRI-BLOCK WITH 12° RAKE -->
  <!-- Total width ~ 240px, Height ~ 108px, centered at (200, 204) -->
  <g transform="translate(200, 204)">
    <g transform="skewX(-12)">
      
      <!-- LEFT M: SOLID ARANCIO XANTO WITH Y-SHAPE NOTCH -->
      <path d="M -118,-54 L -95,-54 L -79,-6 L -63,-54 L -40,-54 L -40,54 L -62,54 L -62,-12 L -73,22 L -85,22 L -96,-12 L -96,54 L -118,54 Z" 
            fill="url(#arancioLaserA1)"
            stroke="#ffffff"
            stroke-width="0.8"
            stroke-opacity="0.35"/>

      <!-- CENTER NEGATIVE SPACE BLOCK: FLUSH INTEGRATED MONOLITH -->
      <rect x="-35" y="-54" width="70" height="108" rx="4" 
            fill="#050810" 
            stroke="url(#arancioLaserA1)" 
            stroke-width="2.2"/>

      <!-- THE INVERTED M: BRUSHED PLATINUM/TITANIUM (SHARP Y-CHEVRON CUT) -->
      <path d="M -29,-46 L -13,-46 L 0,2 L 13,-46 L 29,-46 L 29,46 L 15,46 L 15,-16 L 4,18 L -4,18 L -15,-16 L -15,46 L -29,46 Z" 
            fill="url(#titaniumA1)"
            stroke="#ffffff"
            stroke-width="0.8"
            stroke-opacity="0.5"/>

      <!-- RIGHT M: SOLID ARANCIO XANTO COMPLEMENTARY WING -->
      <path d="M 40,-54 L 63,-54 L 79,-6 L 95,-54 L 118,-54 L 118,54 L 96,54 L 96,-12 L 85,22 L 73,22 L 62,-12 L 62,54 L 40,54 Z" 
            fill="url(#arancioLaserA1)"
            stroke="#ffffff"
            stroke-width="0.8"
            stroke-opacity="0.35"/>

    </g>
  </g>

  <!-- 4. LOWER THIRD: STERATO COLLECTOR BADGE WITH NT 06 MMM & 1 OF 1499 -->
  <g transform="translate(200, 318)" text-anchor="middle">
    <!-- Aerodynamic Diffuser Winglet (Y-Shape Sterrato DNA) -->
    <path d="M -52,-8 L -22,-2 L 0,-14 L 22,-2 L 52,-8 L 34,2 L 0,-4 L -34,2 Z" 
          fill="url(#arancioLaserA1)"/>

    <!-- High-Precision Technical Plaque -->
    <rect x="-84" y="6" width="168" height="26" rx="4" 
          fill="#070c16" 
          stroke="url(#stealthBevelA1)" 
          stroke-width="1.2"/>
    
    <!-- 1 OF 1499: Ultra-crisp High Contrast Vector Text -->
    <text y="23.5" 
          font-family="'Space Grotesk', -apple-system, sans-serif" 
          font-size="11" 
          font-weight="900" 
          letter-spacing="3" 
          fill="#ffffff">1 OF 1499</text>

    <!-- Subtitle: Spec Provenance -->
    <text y="46" 
          font-family="'Space Grotesk', -apple-system, sans-serif" 
          font-size="8.5" 
          font-weight="800" 
          letter-spacing="2" 
          fill="#ff944d">NT &#183; 06 &#183; MMM</text>
  </g>

  <!-- 5. BOTTOM RAZOR STINGER (REAR SPLITTER FIN) -->
  <polygon points="200,392 206,412 194,412" fill="url(#arancioLaserA1)"/>
</svg>